<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CRUD (Bootstrap 5 + HTMX + WebBroker)</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous">

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>

  <style>
    body { padding: 24px; }
    .form-grid { max-width: 560px; }
    .htmx-indicator {
      display: none;
    }
    .htmx-request .htmx-indicator {
      display: inline-block;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container">
    <h1 class="mb-4">Proyectos</h1>

    <!-- Formulario (Nueva fila / Editar) -->
    <div class="card form-grid shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Nuevo / Editar</h5>
        <form hx-post="/projects" hx-target="#list" hx-swap="innerHTML">
          <input type="hidden" name="action" value="save">

          <div class="mb-3">
            <label class="form-label">ID</label>
            <input id="PROJ_ID" name="PROJ_ID" class="form-control" placeholder="Ej: P001">
            <div class="form-text">Obligatorio. Si existe, se actualizará; si no, se insertará.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input id="PROJ_NAME" name="PROJ_NAME" class="form-control" placeholder="Ej: Portal Intranet">
          </div>

          <div class="mb-3">
            <label class="form-label">Producto</label>
            <input id="PRODUCT" name="PRODUCT" class="form-control" placeholder="Ej: Web / Mobile / Backoffice">
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              Guardar
              <span class="spinner-border spinner-border-sm ms-2 htmx-indicator" role="status" aria-hidden="true"></span>
            </button>
            <button type="button" class="btn btn-outline-secondary" onclick="clearForm()">Limpiar</button>
          </div>
        </form>
      </div>
    </div>

    <hr class="my-4">

    <!-- Lista (tabla) -->
    <div class="d-flex align-items-center gap-2">
      <h4 class="mb-0">Lista</h4>
      <div class="text-muted small">(se carga automáticamente)</div>
      <div class="ms-auto small text-muted">
        <span class="htmx-indicator">Cargando…</span>
      </div>
    </div>

    <div id="list"
         class="mt-2"
         hx-get="/projects"
         hx-trigger="load"
         hx-swap="innerHTML">
    </div>
  </div>

  <!-- Bootstrap bundle (opcional si usas features JS de Bootstrap como modal/toast) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>

  <script>
    function edit(id, name, prod){
      PROJ_ID.value = id;
      PROJ_ID.readOnly = true;
      PROJ_NAME.value = name;
      PRODUCT.value = prod;
    }
    function clearForm(){
      PROJ_ID.value = "";
      PROJ_ID.readOnly = false;
      PROJ_NAME.value = "";
      PRODUCT.value = "";
    }
  </script>
</body>
</html>
